name: Unattended Proposal Campaign Loop

on:
  schedule:
    - cron: "0 9 * * *"    # Runs ONCE per day at 9:00 AM UTC
  workflow_dispatch:

jobs:
  run-campaign-beat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv "mcp<2"

      - name: Run OpenCode Beat
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.1-flash-lite
          use_github_token: "true"
          prompt: "Check state.json. If status is NOT_STARTED or IN_PROGRESS and no email has been sent yet, draft the initial proposal email and call the send_proposal_email MCP tool. Update state.json status to WAITING_FOR_REPLY after sending, then exit."

      - name: Check Completion Guard
        id: checker
        run: python check_completion.py
        continue-on-error: true

      - name: Commit and Push Updated State
        run: |
          git add state.json TODO.md PROGRESS.md
          git diff-index --quiet HEAD || git commit -m "chore: auto-update campaign state [skip ci]"
          git push